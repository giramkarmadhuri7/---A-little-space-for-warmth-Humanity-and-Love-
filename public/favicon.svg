<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Warm Ivory Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#FAF6EF" stroke="#D4C7B4" stroke-width="2.5" />

