  <path d="M13.5 36.5 C19.5 35 26.5 36 32 39.5 L32 51 C26 48 19.5 47.5 14.5 48.5 Z" fill="#FFFDF8" stroke="#2B211C" stroke-width="1.6" stroke-linejoin="round" />
