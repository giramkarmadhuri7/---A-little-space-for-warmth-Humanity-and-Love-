  <path d="M17.5 41.5 C21.5 41 25.5 41.5 28.5 43" stroke="#CDBEAA" stroke-width="1.2" stroke-linecap="round" />
  <path d="M18 45 C22 44.5 25.5 45 28.5 46.2" stroke="#CDBEAA" stroke-width="1.2" stroke-linecap="round" />
