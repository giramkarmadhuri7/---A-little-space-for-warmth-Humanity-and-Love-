    <ellipse cx="0" cy="-10" rx="3" ry="6.2" fill="#E8AC2E" stroke="#2B211C" stroke-width="1" />
    <ellipse cx="0" cy="10" rx="3" ry="6.2" fill="#E8AC2E" stroke="#2B211C" stroke-width="1" />
    <ellipse cx="-10" cy="0" rx="6.2" ry="3" fill="#E8AC2E" stroke="#2B211C" stroke-width="1" />
    <ellipse cx="10" cy="0" rx="6.2" ry="3" fill="#E8AC2E" stroke="#2B211C" stroke-width="1" />
    <ellipse cx="0" cy="-10" rx="3" ry="6.2" transform="rotate(45)" fill="#F0BD49" stroke="#2B211C" stroke-width="1" />
    <ellipse cx="0" cy="-10" rx="3" ry="6.2" transform="rotate(135)" fill="#F0BD49" stroke="#2B211C" stroke-width="1" />
    <ellipse cx="0" cy="-10" rx="3" ry="6.2" transform="rotate(225)" fill="#F0BD49" stroke="#2B211C" stroke-width="1" />
    <ellipse cx="0" cy="-10" rx="3" ry="6.2" transform="rotate(315)" fill="#F0BD49" stroke="#2B211C" stroke-width="1" />
    <!-- Earthy Brown Sunflower Center -->
    <circle cx="0" cy="0" r="6.4" fill="#5C3D2E" stroke="#2B211C" stroke-width="1.4" />
    <circle cx="0" cy="0" r="2.8" fill="#3B261C" />
  </g>

  <!-- Stem -->
  <path d="M32 30 V46" stroke="#4F6855" stroke-width="2.4" stroke-linecap="round" />

