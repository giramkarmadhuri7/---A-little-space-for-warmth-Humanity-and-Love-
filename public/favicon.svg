  <path d="M32 39 C38 37 45 31 46 25 C40 25 35 29 32 35 Z" fill="#4F6855" stroke="#2B211C" stroke-width="1.4" stroke-linejoin="round" />

  <!-- Sunflower Petals (Simplified & Bold for 16px/32px Clarity) -->
